name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pip list
      - name: pytest
        # -X faulthandler: Python traceback on a crash in compiled code (e.g. netCDF/HDF5).
        # On failure the end of the output is also added as an annotation, readable without logging in.
        run: |
          set +e
          python -X faulthandler -m pytest -v -p no:cacheprovider 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::error title=pytest failed (exit $status)::$(tail -n 60 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit $status
